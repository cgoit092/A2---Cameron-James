syntax = "proto3";

package campus.registrations.v1;

service RegistrationService {
  rpc CancelBooking(BookingId) returns (Empty);
  rpc ListConfirmedBookings(EventRegistrationsRequest) returns (ConfirmedBookingList);
  rpc CreateParticipant(CreateParticipantRequest) returns (Participant);
  rpc GetParticipant(ParticipantId) returns (Participant);
  rpc CreateBooking(CreateBookingRequest) returns (Booking);
}

message BookingId { int64 booking_id = 1; }
message Empty {}

message EventRegistrationsRequest {
  int64 event_id = 1;
}
message ConfirmedBooking {
  int64 booking_id = 1;
  int64 event_id = 2;
  int64 participant_id = 3;
  string participant_name = 4;
}
message ConfirmedBookingList {
    repeated ConfirmedBooking bookings = 1;
}
message ParticipantId {
  int64 participant_id = 1;
}

message CreateParticipantRequest {
  string name = 1;
}

message Participant {
  int64 participant_id = 1;
  string name = 2;
}

message CreateBookingRequest {
  int64 event_id = 1;
  int64 participant_id = 2;
}

message Booking {
  int64 booking_id = 1;
  int64 event_id = 2;
  int64 participant_id = 3;
  string participant_name = 4;
}
